<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Support Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="brand">AI Student Support</div>
            <div class="logo">🎓</div>
        </header>

        <main>
            <h1>Ask anything about campus life</h1>
            <p class="subtitle">Quick answers for fees, exams, hostel, placements and more.</p>

            <div class="input-group">
                <textarea id="questionInput" placeholder="Type your question here... (e.g. "How do I apply for scholarship?")"></textarea>
                <div class="controls">
                    <div class="suggestions">
                        <button class="suggest">Fee Structure</button>
                        <button class="suggest">Exam Dates</button>
                        <button class="suggest">Placement Cell</button>
                    </div>
                    <button id="sendBtn" class="primary">Send</button>
                </div>
            </div>

            <div id="errorMsg" class="error-msg">Unable to connect to backend.</div>

            <div id="resultCard" class="result-card">
                <div class="result-header">Response</div>
                <div class="result-grid">
                    <div>
                        <div class="result-label">Question</div>
                        <div id="resQuestion" class="result-value"></div>
                    </div>
                    <div>
                        <div class="result-label">Intent</div>
                        <div id="resIntent" class="result-value"></div>
                    </div>
                    <div>
                        <div class="result-label">Confidence</div>
                        <div id="resConfidence" class="result-value"></div>
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <div class="result-label">Matched Question</div>
                        <div id="resMatched" class="result-value"></div>
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <div class="result-label">Answer</div>
                        <div id="resAnswer" class="result-value res-answer"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
